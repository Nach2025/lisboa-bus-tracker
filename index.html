<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚌 Lisboa Bus Tracker - Tempo Real</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #7c5cfc;
    --teal: #00f5e0;
    --gold: #ffe066;
    --red: #f85149;
    --green: #3fb950;
    --map-bg: #1a1a2e;
    --map-tiles: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
    --popup-bg: var(--surface);
  }
  /* Light mode */
  [data-theme="light"] {
    --bg: #ffffff;
    --surface: #f3f4f6;
    --surface2: #e5e7eb;
    --border: #d1d5db;
    --text: #111827;
    --text2: #6b7280;
    --accent: #7c5cfc;
    --teal: #0d9488;
    --gold: #ca8a04;
    --red: #dc2626;
    --green: #16a34a;
    --map-bg: #f0f0f0;
    --map-tiles: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
    --popup-bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    z-index: 1000;
  }
  #header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  #header .badge {
    font-size: 11px;
    background: var(--surface2);
    color: var(--text2);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  #search-row {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 180px;
  }
  #search-row input {
    flex: 1;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    min-width: 60px;
  }
  #search-row input:focus {
    border-color: var(--accent);
  }
  #search-row input::placeholder {
    color: var(--text2);
  }
  .btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-star {
    background: transparent;
    border-color: var(--border);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
  }
  .btn-star.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }
  #filter-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
  }
  #filter-row label {
    font-size: 12px;
    color: var(--text2);
  }
  .agency-btn {
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .agency-btn:hover { border-color: var(--accent); color: var(--text); }
  .agency-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .watch-mode-btn {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .watch-mode-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }
  #map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }
  #status-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
    z-index: 1000;
  }
  #status-bar span { display: flex; align-items: center; gap: 4px; }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .leaflet-container { background: var(--map-bg) !important; }
  .leaflet-control-zoom a {
    background: var(--surface2) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-popup-content-wrapper {
    background: var(--popup-bg) !important;
    color: var(--text) !important;
    border: 1px solid var(--border);
    border-radius: 10px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
  }
  .leaflet-popup-tip { background: var(--popup-bg) !important; }
  .leaflet-popup-close-button { color: var(--text2) !important; }
  .bus-marker {
    background: var(--accent);
    border: 2px solid #fff;
    border-radius: 50%;
    width: 32px !important;
    height: 32px !important;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 2px 8px rgba(124,92,252,0.5);
    transition: all 0.3s ease;
  }
  .bus-marker.stopped { background: var(--red); }
  .bus-marker.moving { background: var(--accent); }
  .bus-marker.fast { background: var(--teal); color: #000; }
  .bus-marker.highlight {
    border-color: var(--gold);
    box-shadow: 0 0 16px rgba(255,224,102,0.6);
    transform: scale(1.2);
  }
  .bus-marker.watched {
    border-color: var(--gold) !important;
    border-width: 3px;
    box-shadow: 0 0 12px rgba(255,224,102,0.4);
  }
  .leaflet-marker-icon { border: none !important; }
  #info-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 45vh;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    border-radius: 16px 16px 0 0;
    padding: 16px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 2000;
    overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
  }
  #info-panel.open { transform: translateY(0); }
  #info-panel .handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 12px;
    cursor: pointer;
  }
  #info-panel h2 {
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--gold);
  }
  #info-panel .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  #info-panel .detail-row .label { color: var(--text2); }
  #info-panel .detail-row .value { font-weight: 600; }
  #info-panel .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
  }
  .watch-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    width: 100%;
    text-align: center;
  }
  .watch-btn.active {
    background: var(--gold);
    color: #000;
  }
  /* Watch list panel */
  #watchlist-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    max-width: 85vw;
    height: 100dvh;
    background: var(--surface);
    border-left: 2px solid var(--gold);
    z-index: 3000;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -4px 0 20px rgba(0,0,0,0.5);
  }
  #watchlist-panel.open { transform: translateX(0); }
  #watchlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #watchlist-header h2 {
    font-size: 16px;
    color: var(--gold);
  }
  #watchlist-header .close-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 22px;
    cursor: pointer;
  }
  #watchlist-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .watchlist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .watchlist-item:hover { background: var(--surface2); }
  .watchlist-item .line-name {
    font-weight: 600;
    font-size: 15px;
  }
  .watchlist-item .line-agency {
    font-size: 11px;
    color: var(--text2);
  }
  .watchlist-item .remove-btn {
    background: none;
    border: none;
    color: var(--red);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .watchlist-item .remove-btn:hover { opacity: 1; }
  #watchlist-empty {
    padding: 30px 16px;
    text-align: center;
    color: var(--text2);
    font-size: 14px;
  }
  #watchlist-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
  }
  .stop-icon {
    width: 10px !important;
    height: 10px !important;
    border-radius: 50%;
    background: var(--teal);
    opacity: 0.5;
    border: 1px solid var(--teal);
  }
  /* Stop markers for learned stops */
  .stop-marker-learned {
    width: 8px !important;
    height: 8px !important;
    border-radius: 50%;
    background: var(--gold);
    border: 1px solid rgba(255,224,102,0.5);
    opacity: 0.7;
  }
  /* User location marker */
  .user-location-marker {
    width: 20px !important;
    height: 20px !important;
    background: #4285f4;
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(66,133,244,0.6);
  }
  .user-location-pulse {
    width: 40px !important;
    height: 40px !important;
    background: rgba(66,133,244,0.2);
    border-radius: 50%;
    position: absolute;
    animation: pulse-loc 2s infinite;
  }
  @keyframes pulse-loc {
    0% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 0.2; }
    100% { transform: scale(0.8); opacity: 0.6; }
  }
  /* GPS button */
  .gps-btn {
    position: absolute;
    bottom: 120px;
    right: 12px;
    z-index: 1001;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    transition: all 0.15s;
  }
  .gps-btn:hover { background: var(--accent); border-color: var(--accent); }
  .gps-btn.active { background: #4285f4; border-color: #4285f4; }
  /* Route line style */
  .route-line {
    stroke-dasharray: 8 6;
    animation: dash-flow 1s linear infinite;
  }
  @keyframes dash-flow {
    to { stroke-dashoffset: -14; }
  }
  .leaflet-control-attribution { display: none !important; }
  .overlay-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 2500;
    display: none;
  }
  .overlay-backdrop.show { display: block; }
  /* Watchlist editor styles */
  #watchlist-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .editor-search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .editor-search input {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px; outline: none;
  }
  .editor-search input:focus { border-color: var(--accent); }
  .editor-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .editor-line-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background 0.1s;
  }
  .editor-line-item:hover { background: var(--surface2); }
  .editor-line-item .line-info { display: flex; align-items: center; gap: 10px; }
  .editor-line-item .line-check {
    width: 22px; height: 22px; border-radius: 4px; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.15s;
  }
  .editor-line-item .line-check.checked {
    background: var(--gold); border-color: var(--gold); color: #000;
  }
  .editor-line-item .line-number { font-weight: 600; font-size: 15px; }
  .editor-line-item .line-agency { font-size: 11px; color: var(--text2); }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .header-btn {
    background: none; border: none; color: var(--text2); font-size: 18px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.1s;
  }
  .header-btn:hover { background: var(--surface2); color: var(--text); }
  @media (max-width: 600px) {
    #header { padding: 8px 10px; }
    #header h1 { font-size: 15px; }
    .btn { font-size: 12px; padding: 5px 10px; }
    #filter-row { padding: 6px 10px; }
    .agency-btn { font-size: 10px; padding: 2px 8px; }
    #watchlist-panel { width: 100%; max-width: 100vw; }
  }
</style>
</head>
<body>

<div id="header">
  <h1>🚌 Lisboa Bus Tracker</h1>
  <span class="badge" id="vehicle-count">—</span>
  <div id="search-row">
    <input type="text" id="line-search" placeholder="Línea (ej: 732, 201, 28E)" />
    <button class="btn" id="search-btn">🔍</button>
    <button class="btn" id="clear-btn">✕</button>
  </div>
  <button class="btn btn-star" id="watchlist-toggle-btn" title="Lista de seguimento">⭐</button>
  <button class="btn" id="theme-toggle-btn" title="Mudar tema">🌓</button>
</div>

<div id="filter-row">
  <label>Operadora:</label>
  <button class="agency-btn active" data-agency="all">Todas</button>
  <button class="agency-btn" data-agency="1">Carris (Lisboa)</button>
  <button class="agency-btn" data-agency="41">CMetropolitana</button>
  <button class="agency-btn" data-agency="42">42</button>
  <button class="agency-btn" data-agency="43">43</button>
  <button class="agency-btn" data-agency="44">44</button>
  <button class="agency-btn" data-agency="15">15</button>
  <button class="agency-btn" data-agency="21">21</button>
  <span style="flex:1"></span>
  <button class="watch-mode-btn" id="watch-mode-btn">⭐ Solo seguidas</button>
</div>

<div id="map"></div>

<button class="gps-btn" id="gps-btn" title="📍 Minha localização">📍</button>

<div id="status-bar">
  <span><span class="live-dot"></span> Tempo real</span>
  <span id="status-text">A carregar...</span>
  <span>🔍 clique num bus para detalhes</span>
</div>

<div id="info-panel">
  <div class="handle"></div>
  <button class="close-btn" id="panel-close">✕</button>
  <h2 id="panel-title">🚌 Bus</h2>
  <div id="panel-details"></div>
  <button class="watch-btn" id="panel-watch-btn">⭐ Seguir linha</button>
  <button class="watch-btn" id="panel-track-btn" style="margin-top:6px;border-color:var(--teal);color:var(--teal);">🎯 Seguir este bus</button>
  <button class="watch-btn" id="panel-solo-btn" style="margin-top:6px;border-color:var(--accent);color:var(--accent);">🔍 Mostrar só este</button>
</div>

<div class="overlay-backdrop" id="watchlist-backdrop"></div>
<div id="watchlist-panel">
  <div id="watchlist-header">
    <h2>⭐ Lista de seguimento</h2>
    <div class="header-actions">
      <button class="header-btn" id="watchlist-edit-btn" title="Editar">✏️</button>
      <button class="close-btn" id="watchlist-close">✕</button>
    </div>
  </div>
  <div id="watchlist-body">
    <div id="watchlist-empty">Nenhuma linha seguida ainda.<br>Clique num bus e use ⭐ Seguir linha</div>
  </div>
  <div id="watchlist-editor" style="display:none;">
    <div class="editor-search">
      <input type="text" id="editor-search-input" placeholder="Buscar linha (ex: 728, 2733, ...)" />
    </div>
    <div class="editor-list" id="editor-list">
      <!-- Available lines will be rendered here -->
    </div>
  </div>
  <div id="watchlist-footer">
    <span id="watchlist-count">0 linhas</span>
    <button class="watch-mode-btn" id="watchlist-mode-btn">🔍 Mostrar no mapa</button>
  </div>
</div>

<script>
// ─── CONFIG ───
const REFRESH_MS = 3000;
const CARRS_CENTER = [38.7223, -9.1393];
const CARRS_ZOOM = 13;
const STORAGE_KEY = 'lisboa_bus_watchlist';
const ANIM_DURATION = 2500;

// Mapa de líneas comerciales ↔ códigos internos de la API
// Carris usa numeración interna distinta a los números de ruta
const LINE_ALIASES = {
  '728': ['204'],    // 728 comercial = L204 en API (Restelo - Portela) ← TU BUS
  '204': ['728'],    // bidireccional
  '731': ['190'],    // 731 = L190 (Av. José Malhoa - Sacavém)
  '190': ['731'],    // bidireccional
};

// Función para expandir una búsqueda con alias
function expandLineSearch(term) {
  const results = new Set();
  results.add(term);
  const aliases = LINE_ALIASES[term];
  if (aliases) {
    aliases.forEach(a => results.add(a));
  }
  // También buscar inversamente: si hay algún alias que apunte a este término
  for (const [key, vals] of Object.entries(LINE_ALIASES)) {
    if (vals.includes(term)) {
      results.add(key);
    }
  }
  return Array.from(results);
}

// Preconfigurar líneas de Portela en la watchlist
const DEFAULT_WATCH_LINES = [
  {line:'728', agency:'1'}, {line:'731', agency:'1'},
];

// Líneas disponibles para añadir desde el editor
const AVAILABLE_LINES = [
  // Carris Metropolitana (agência 42) - tus líneas de Portela
  {line:'2713', agency:'42'}, {line:'2722', agency:'42'},

  {line:'2754', agency:'42'}, {line:'2756', agency:'42'},
  {line:'2759', agency:'42'}, {line:'2761', agency:'42'},
  {line:'2762', agency:'42'}, {line:'2765', agency:'42'},
  {line:'2769', agency:'42'}, {line:'2776', agency:'42'},
  {line:'2780', agency:'42'}, {line:'2781', agency:'42'},
  {line:'2785', agency:'42'}, {line:'2790', agency:'42'},
  {line:'2794', agency:'42'}, {line:'2795', agency:'42'},
  {line:'2797', agency:'42'},
  // Carris (agência 1) - líneas urbanas de Lisboa
  {line:'728', agency:'1'}, {line:'731', agency:'1'},
  {line:'722', agency:'1'}, {line:'2029', agency:'1'},
  {line:'705', agency:'1'}, {line:'708', agency:'1'},
  {line:'714', agency:'1'}, {line:'727', agency:'1'},
  {line:'737', agency:'1'}, {line:'744', agency:'1'},
  {line:'750', agency:'1'}, {line:'751', agency:'1'},
  {line:'759', agency:'1'}, {line:'782', agency:'1'},
  {line:'783', agency:'1'}, {line:'794', agency:'1'},
  {line:'706', agency:'1'}, {line:'712', agency:'1'},
  {line:'713', agency:'1'}, {line:'716', agency:'1'},
  {line:'717', agency:'1'}, {line:'720', agency:'1'},
  {line:'723', agency:'1'}, {line:'724', agency:'1'},

// ─── WATCH LIST (persisted in localStorage) ───
function getWatchList() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}
function saveWatchList(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function addWatchLine(lineName, agencyId) {
  const list = getWatchList();
  if (list.some(item => item.line === lineName && item.agency === agencyId)) return false;
  list.push({ line: lineName, agency: agencyId, addedAt: Date.now() });
  saveWatchList(list);
  // Si la línea tiene alias, añadir también su línea hermana
  const aliases = LINE_ALIASES[lineName];
  if (aliases && agencyId === '1') {
    aliases.forEach(alias => {
      if (!list.some(item => item.line === alias && item.agency === agencyId)) {
        list.push({ line: alias, agency: agencyId, addedAt: Date.now() });
      }
    });
    saveWatchList(list);
  }
  renderWatchList();
  updateMap();
  return true;
}
function removeWatchLine(lineName, agencyId) {
  let list = getWatchList();
  list = list.filter(item => !(item.line === lineName && item.agency === agencyId));
  saveWatchList(list);
  renderWatchList();
  updateMap();
}
function isLineWatched(lineName, agencyId) {
  return getWatchList().some(item => item.line === lineName && item.agency === agencyId);
}

function renderWatchList() {
  const list = getWatchList();
  const body = document.getElementById('watchlist-body');
  const countEl = document.getElementById('watchlist-count');

  countEl.textContent = `${list.length} linha${list.length !== 1 ? 's' : ''}`;

  if (list.length === 0) {
    body.innerHTML = '<div id="watchlist-empty">Nenhuma linha seguida ainda.<br>Clique num bus e use ⭐ Seguir linha</div>';
    return;
  }

  body.innerHTML = list.map((item, idx) => {
    const color = AGENCY_COLORS[item.agency] || '#7c5cfc';
    const agencyName = AGENCY_NAMES[item.agency] || `Op. ${item.agency}`;
    return `<div class="watchlist-item" data-idx="${idx}">
      <div>
        <div class="line-name" style="color:${color}">🚌 ${item.line}</div>
        <div class="line-agency">${agencyName}</div>
      </div>
      <button class="remove-btn" data-line="${item.line}" data-agency="${item.agency}" title="Remover">✕</button>
    </div>`;
  }).join('');

  // Remove buttons
  body.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeWatchLine(btn.dataset.line, btn.dataset.agency);
    });
  });
  // Click item to show on map
  body.querySelectorAll('.watchlist-item').forEach(el => {
    el.addEventListener('click', () => {
      const line = el.querySelector('.remove-btn')?.dataset.line;
      const agency = el.querySelector('.remove-btn')?.dataset.agency;
      if (line) {
        watchMode = true;
        document.getElementById('watch-mode-btn').classList.add('active');
        searchLine = line;
        document.getElementById('line-search').value = line;
        updateMap();
        closeWatchList();
      }
    });
  });
}

function toggleWatchList() {
  const panel = document.getElementById('watchlist-panel');
  const backdrop = document.getElementById('watchlist-backdrop');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open');
  backdrop.classList.toggle('show');

  document.getElementById('watchlist-body').style.display = '';
}

let editorOpen = false;

function toggleEditor() {
  editorOpen = !editorOpen;
  const editor = document.getElementById('watchlist-editor');
  const body = document.getElementById('watchlist-body');
  const btn = document.getElementById('watchlist-edit-btn');
  
  if (editorOpen) {
    editor.style.display = 'flex';

    renderEditor();
  } else {
    editor.style.display = 'none';
    body.style.display = '';
    btn.textContent = '✏️';
  }
}

function renderEditor(filter) {
  const list = document.getElementById('editor-list');
  const watchList = getWatchList();
  
  let lines = AVAILABLE_LINES;
  if (filter) {
    const f = filter.toLowerCase();
    lines = lines.filter(l => l.line.includes(f));
  }
  
  // Sort: watched first, then by line number
  lines.sort((a, b) => {
    const aWatched = isLineWatched(a.line, a.agency);
    const bWatched = isLineWatched(b.line, b.agency);
    if (aWatched && !bWatched) return -1;
    if (!aWatched && bWatched) return 1;
    return parseInt(a.line) - parseInt(b.line);
  });
  
  list.innerHTML = lines.map(item => {
    const watched = isLineWatched(item.line, item.agency);
    const color = AGENCY_COLORS[item.agency] || '#7c5cfc';
    const agencyName = AGENCY_NAMES[item.agency] || `Op. ${item.agency}`;
    return `<div class="editor-line-item" data-line="${item.line}" data-agency="${item.agency}">
      <div class="line-info">
        <div class="line-check ${watched ? 'checked' : ''}">${watched ? '✓' : ''}</div>
        <div>
          <div class="line-number" style="color:${color}">🚌 ${item.line}</div>
          <div class="line-agency">${agencyName}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  
  // Toggle on click
  list.querySelectorAll('.editor-line-item').forEach(el => {
    el.addEventListener('click', () => {
      const line = el.dataset.line;
      const agency = el.dataset.agency;
      if (isLineWatched(line, agency)) {
        removeWatchLine(line, agency);
      } else {
        addWatchLine(line, agency);
      }
      // Re-render with current filter
      const searchVal = document.getElementById('editor-search-input').value;
      renderEditor(searchVal);
    });
  });
}

// ─── VEHICLE STATUS ───
function getStatusClass(speed) {
  if (speed === undefined || speed === null) return 'stopped';
  if (speed === 0) return 'stopped';
  if (speed < 15) return 'moving';
  return 'fast';
}

function getStatusText(speed) {
  if (speed === undefined || speed === null) return 'Parado';
  if (speed === 0) return '🛑 Parado';
  if (speed < 15) return '🚌 Em marcha';
  return '💨 Rápido';
}

// ─── UPDATE VEHICLES ───
async function fetchVehicles() {
  try {
    const url = 'https://go.tmlmobilidade.pt/hub/api/v1/realtime/vehicles/positions';
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    vehiclesData = json.data || [];
    updateMap();
    updateStatus();
    if (isFirstLoad) {
      isFirstLoad = false;
      fitBounds();
    }
  } catch (e) {
    document.getElementById('status-text').textContent = '⚠️ Erro a carregar dados';
    console.error('Fetch error:', e);
  }
}

function fitBounds() {
  if (vehiclesData.length === 0) return;
  const bounds = [];
  for (const v of vehiclesData) {
    if (v.latitude && v.longitude) {
      bounds.push([v.latitude, v.longitude]);
    }
  }
  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
  }
}

function updateMap() {
  const filtered = filterVehicles();

  document.getElementById('vehicle-count').textContent =
    `${filtered.length} veículo${filtered.length !== 1 ? 's' : ''}`;

  const now = Date.now();
  const newMarkers = {};
  const prevData = vehiclesLayer._prevData || {};

  // Track which vehicle IDs are still visible
  const seenIds = new Set();

  for (const v of filtered) {
    const lat = v.latitude;
    const lon = v.longitude;
    if (!lat || !lon) continue;

    const lineName = formatLineName(v);
    const agency = getAgencyId(v);
    const isWatched = isLineWatched(lineName, agency);
    const vehicleId = v._id || v.vehicle_id;
    seenIds.add(vehicleId);

    let marker = prevData[vehicleId]?.marker;

    if (marker) {
      // Move existing marker with smooth animation
      const prevLat = marker._targetLat !== undefined ? marker._targetLat : marker.getLatLng().lat;
      const prevLon = marker._targetLon !== undefined ? marker._targetLon : marker.getLatLng().lng;
      marker._fromLat = prevLat;
      marker._fromLon = prevLon;
      marker._targetLat = lat;
      marker._targetLon = lon;
      marker._animStart = now;

      // Update stored vehicle data
      marker._vehicleData = v;

      // Update icon class
      let className = 'bus-marker ' + getStatusClass(v.speed);
      if (isWatched) className += ' watched';
      if (selectedVehicleId === vehicleId) className += ' highlight';
      marker._targetClass = className;

      // Update icon if watched status changed
      const wasWatched = marker._wasWatched;
      if (wasWatched !== isWatched) {
        marker.setIcon(L.divIcon({
          className,
          html: `<span>${lineName}</span>`,
          iconSize: selectedVehicleId === vehicleId ? [40, 40] : [32, 32],
          iconAnchor: selectedVehicleId === vehicleId ? [20, 20] : [16, 16]
        }));
        marker._wasWatched = isWatched;
      }
    } else {
      // New marker
      let className = 'bus-marker ' + getStatusClass(v.speed);
      if (isWatched) className += ' watched';

      const icon = L.divIcon({
        className,
        html: `<span>${lineName}</span>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      marker = L.marker([lat, lon], { icon });
      marker._vehicleId = vehicleId;
      marker._vehicleData = v;
      marker._targetLat = lat;
      marker._targetLon = lon;
      marker._fromLat = lat;
      marker._fromLon = lon;
      marker._animStart = now;
      marker._wasWatched = isWatched;

      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        selectVehicle(v, marker);
      });
      
      // Tooltip for watched buses
      if (isWatched) {
        marker.bindTooltip(`🚌 ${lineName}`, { permanent: false, direction: 'top', offset: [0, -10] });
      }

      vehiclesLayer.addLayer(marker);
    }

    // Highlight selected
    if (selectedVehicleId === vehicleId) {
      marker.setIcon(L.divIcon({
        className: 'bus-marker ' + getStatusClass(v.speed) + ' highlight' + (isWatched ? ' watched' : ''),
        html: `<span>${lineName}</span>`,
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      }));
    }

    newMarkers[vehicleId] = { marker, v };
  }

  // Remove markers that are no longer visible
  for (const id in prevData) {
    if (!seenIds.has(id)) {
      vehiclesLayer.removeLayer(prevData[id].marker);
    }
  }

  // Store current state for next frame
  vehiclesLayer._prevData = newMarkers;
  allMarkers = {};
  for (const id in newMarkers) {
    allMarkers[id] = newMarkers[id].marker;
  }

  // Start animation loop
  if (!animationFrameId) {
    animateMarkers();
  }

  // Show learned stops for watched lines
  showLearnedStops();

  // Show route line for first searched line
  if (searchLine) {
    showRouteLine(searchLine);
  } else if (watchMode) {
    const list = getWatchList();
    if (list.length > 0) showRouteLine(list[0].line);
  } else {
    routeLayer.clearLayers();
  }

  // Update panel for selected vehicle
  if (selectedVehicleId) {
    const stillHere = filtered.find(v => v._id === selectedVehicleId || v.vehicle_id === selectedVehicleId);
    if (stillHere) {
      showVehiclePanel(stillHere);
      // Auto-follow if tracking
      if (trackingVehicleId === selectedVehicleId && stillHere.latitude && stillHere.longitude) {
        map.panTo([stillHere.latitude, stillHere.longitude], { animate: true, duration: 0.5 });
      }
    } else {
      if (!showOnlySelected) closePanel();
    }
  }
}

// Smooth animation: interpolate positions every frame
function animateMarkers() {
  animationFrameId = requestAnimationFrame(animateMarkers);
  const now = Date.now();

  const prevData = vehiclesLayer._prevData || {};
  let anyAnimating = false;

  for (const id in prevData) {
    const { marker } = prevData[id];
    if (marker._targetLat === undefined || marker._fromLat === undefined) continue;

    const elapsed = now - (marker._animStart || now);
    const t = Math.min(elapsed / ANIM_DURATION, 1);
    // Ease-out cubic for smooth deceleration
    const ease = 1 - Math.pow(1 - t, 3);

    const lat = marker._fromLat + (marker._targetLat - marker._fromLat) * ease;
    const lon = marker._fromLon + (marker._targetLon - marker._fromLon) * ease;

    marker.setLatLng([lat, lon]);

    if (t < 1) anyAnimating = true;
  }

  if (!anyAnimating) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
}

function filterVehicles() {
  let filtered = vehiclesData;
  
  // Solo mode: show only selected vehicle
  if (showOnlySelected && selectedVehicleId) {
    return filtered.filter(v => {
      const vid = v._id || v.vehicle_id;
      return vid === selectedVehicleId;
    });
  }

  const watchList = getWatchList();

  // If watch mode is ON, only show watched lines
  if (watchMode && watchList.length > 0) {
    filtered = filtered.filter(v => {
      const lineName = formatLineName(v);
      const agency = getAgencyId(v);
      return isLineWatched(lineName, agency);
    });
    return filtered;
  }

  if (activeAgency !== 'all') {
    filtered = filtered.filter(v => getAgencyId(v) === activeAgency);
  }

  if (searchLine) {
    const terms = searchLine.toLowerCase().split(/[\s,]+/).filter(t => t);
    // Expandir términos con alias (728 ↔ 204)
    const expandedTerms = [];
    terms.forEach(t => {
      expandLineSearch(t).forEach(et => expandedTerms.push(et.toLowerCase()));
    });
    // Filtro exacto: buscamos coincidencia en line_id original de la API
    // o coincidencia exacta del nombre comercial
    filtered = filtered.filter(v => {
      const lineName = formatLineName(v).toLowerCase();
      // Coincidencia exacta con el nombre comercial
      if (terms.some(t => lineName === t.toLowerCase())) return true;
      // Coincidencia exacta con códigos internos (para compatibilidad)
      const rawLine = (v.line_id || '').toLowerCase();
      return expandedTerms.some(t => {
        // Extraer código numérico puro del line_id (ej: "[1]204" → "204")
        const rawCode = rawLine.replace(/^\[\d+\]/, '');
        return rawCode === t;
      });
    });
  }

  return filtered;
}

function updateStatus() {
  const now = new Date();
  const time = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('status-text').textContent =
    `${vehiclesData.length} veículo${vehiclesData.length !== 1 ? 's' : ''} · ${time}`;
}

// ─── GPS / USER LOCATION ───
let gpsRetries = 0;

function startGPS() {
  if (!navigator.geolocation) {
    alert('Geolocalização não suportada neste navegador.\nTenta usar num telemóvel ou num browser com GPS.');
    return;
  }
  
  gpsActive = !gpsActive;
  const btn = document.getElementById('gps-btn');
  
  if (gpsActive) {
    btn.classList.add('active');
    document.getElementById('status-text').textContent = '📍 A localizar... (ativa o GPS do telemóvel)';
    gpsRetries = 0;
    
    const onSuccess = (pos) => {
      onGPSPosition(pos);
      gpsRetries = 0;
    };
    
    const onError = (err) => {
      console.warn('GPS error:', err.code, err.message);
      gpsRetries++;
      
      if (gpsRetries < 3) {
        document.getElementById('status-text').textContent = `📍 Tentativa ${gpsRetries+1}/3...`;
        // Try again with different options
        setTimeout(() => {
          if (gpsActive) {
            navigator.geolocation.getCurrentPosition(onSuccess, onError, {
              enableHighAccuracy: gpsRetries < 2,
              timeout: 8000,
              maximumAge: 5000
            });
          }
        }, 1000);
      } else {
        document.getElementById('status-text').textContent = '⚠️ GPS indisponível. Ativa o GPS e tenta de novo.';
        gpsActive = false;
        btn.classList.remove('active');
      }
    };
    
    // First get a quick position
    navigator.geolocation.getCurrentPosition(onSuccess, onError, {
      enableHighAccuracy: true,
      timeout: 8000,
      maximumAge: 5000
    });
    
    // Then start continuous tracking
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }
    gpsWatchId = navigator.geolocation.watchPosition(
      onSuccess,
      (err) => { /* silent on watch errors */ },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 3000 }
    );
  } else {
    stopGPS();
  }
}

function stopGPS() {
  gpsActive = false;
  document.getElementById('gps-btn').classList.remove('active');
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  if (userMarker) {
    map.removeLayer(userMarker);
    userMarker = null;
  }
  userLocation = null;
}

function onGPSPosition(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  userLocation = { lat: latitude, lon: longitude, accuracy };
  
  // Update marker
  if (userMarker) {
    userMarker.setLatLng([latitude, longitude]);
    userMarker.setTooltipContent(`📍 Tu (precisão: ${Math.round(accuracy)}m)`);
  } else {
    // Create marker with pulse effect
    userMarker = L.marker([latitude, longitude], {
      icon: L.divIcon({
        className: '',
        html: '<div class="user-location-pulse"></div><div class="user-location-marker"></div>',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      })
    });
    userMarker.bindTooltip(`📍 Tu (precisão: ${Math.round(accuracy)}m)`, { permanent: false, direction: 'top' });
    userMarker.addTo(map);
    map.setView([latitude, longitude], 15);
  }
  
  document.getElementById('status-text').textContent =
    `📍 ${latitude.toFixed(5)}, ${longitude.toFixed(5)} ±${Math.round(accuracy)}m`;
  document.getElementById('gps-btn').classList.add('active');
}

// ─── ROUTE RENDERING ───
function showLearnedStops() {
  // Deprecated - use showRouteLine instead
  stopsLayer.clearLayers();
}

function showRouteLine(lineName) {
  routeLayer.clearLayers();
  stopsLayer.clearLayers();
  
  // Draw the route shape polyline
  const coords = ROUTE_SHAPES[lineName];
  if (coords && coords.length >= 2) {
    const colors = {'728': '#7c5cfc', '731': '#ff6b6b'};
    const color = colors[lineName] || '#7c5cfc';
    
    const polyline = L.polyline(coords, {
      color: color,
      weight: 4,
      opacity: 0.6,
      dashArray: '10 8',
    });
    polyline.bindTooltip(`🚌 ${lineName}`, { direction: 'top', offset: [0, -5] });
    routeLayer.addLayer(polyline);
  }
  
  // Show stops for this line
  const stops = ROUTE_STOPS[lineName];
  if (!stops) return;
  
  stops.forEach(s => {
    const stopIcon = L.divIcon({
      className: '',
      html: `<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7c5cfc;box-shadow:0 0 6px rgba(124,92,252,0.5);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });
    const marker = L.marker([s.lat, s.lon], { icon: stopIcon });
    marker.bindTooltip(`🚏 ${s.name}`, { direction: 'top', offset: [0, -5] });
    stopsLayer.addLayer(marker);
  });
}

// ─── THEME TOGGLE ───
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  const tilesUrl = isLight
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('lisboa_bus_theme', 'dark');
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('lisboa_bus_theme', 'light');
  }
  
  // Reemplazar tiles
  if (tileLayerInstance) {
    map.removeLayer(tileLayerInstance);
    tileLayerInstance = L.tileLayer(tilesUrl, { maxZoom: 19 }).addTo(map);
  }
  
  document.getElementById('theme-toggle-btn').textContent = isLight ? '🌓' : '☀️';
}

function loadTheme() {
  const saved = localStorage.getItem('lisboa_bus_theme');
  if (saved === 'dark') {
    // Solo modo oscuro si el usuario lo guardó explícitamente
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('theme-toggle-btn').textContent = '🌓';
    // Cambiar tiles a oscuros
    if (tileLayerInstance) {
      map.removeLayer(tileLayerInstance);
      tileLayerInstance = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    }
  } else {
    // Por defecto: MODO DÍA ☀️
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('theme-toggle-btn').textContent = '☀️';
    // Cambiar tiles a claros
    if (tileLayerInstance) {
      map.removeLayer(tileLayerInstance);
      tileLayerInstance = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    }
    // Guardar preferencia
    localStorage.setItem('lisboa_bus_theme', 'light');
  }
}

// Refresh stops when watch list changes (override addWatchLine temporarily)
const _origAddWatchLine = addWatchLine;
addWatchLine = function(lineName, agencyId) {
  const result = _origAddWatchLine(lineName, agencyId);
  if (result) showLearnedStops();
  return result;
};

const _origRemoveWatchLine = removeWatchLine;
removeWatchLine = function(lineName, agencyId) {
  _origRemoveWatchLine(lineName, agencyId);
  showLearnedStops();
};

// ─── EVENT LISTENERS ───

// Agency filter buttons
document.querySelectorAll('.agency-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.agency-btn.active')?.classList.remove('active');
    btn.classList.add('active');
    activeAgency = btn.dataset.agency;
    watchMode = false;
    document.getElementById('watch-mode-btn').classList.remove('active');
    updateMap();
    if (vehiclesData.length > 0) updateStatus();
  });
});

// Search
document.getElementById('search-btn').addEventListener('click', () => {
  searchLine = document.getElementById('line-search').value.trim();
  if (searchLine) {
    watchMode = false;
    document.getElementById('watch-mode-btn').classList.remove('active');
  }
  updateMap();
});

document.getElementById('line-search').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') {
    searchLine = e.target.value.trim();
    if (searchLine) {
      watchMode = false;
      document.getElementById('watch-mode-btn').classList.remove('active');
    }
    updateMap();
  }
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('line-search').value = '';
  searchLine = '';
  activeAgency = 'all';
  watchMode = false;
  showOnlySelected = false;
  trackingVehicleId = null;
  document.querySelector('.agency-btn.active')?.classList.remove('active');
  document.querySelector('[data-agency="all"]')?.classList.add('active');
  document.getElementById('watch-mode-btn').classList.remove('active');
  updateMap();
});

// Watch mode toggle
document.getElementById('watch-mode-btn').addEventListener('click', () => {
  const list = getWatchList();
  if (list.length === 0) {
    toggleWatchList();
    return;
  }
  watchMode = !watchMode;
  document.getElementById('watch-mode-btn').classList.toggle('active', watchMode);
  updateMap();
});

document.getElementById('watchlist-mode-btn').addEventListener('click', () => {
  watchMode = true;
  document.getElementById('watch-mode-btn').classList.add('active');
  closeWatchList();
  updateMap();
});

// Panel watch button
document.getElementById('panel-watch-btn').addEventListener('click', () => {
  const btn = document.getElementById('panel-watch-btn');
  const lineName = btn.dataset.line;
  const agencyId = btn.dataset.agency;
  if (!lineName) return;

  if (isLineWatched(lineName, agencyId)) {
    removeWatchLine(lineName, agencyId);
    btn.textContent = '⭐ Seguir linha';
    btn.classList.remove('active');
  } else {
    addWatchLine(lineName, agencyId);
    btn.textContent = '⭐ Seguindo';
    btn.classList.add('active');
  }
});

// Track button: follow this bus in real time
document.getElementById('panel-track-btn').addEventListener('click', () => {
  const btn = document.getElementById('panel-track-btn');
  const vehId = btn.dataset.vehicleId;
  if (!vehId) return;
  
  if (trackingVehicleId === vehId) {
    trackingVehicleId = null;
    btn.textContent = '🎯 Seguir este bus';
    btn.classList.remove('active');
  } else {
    trackingVehicleId = vehId;
    selectedVehicleId = vehId;
    btn.textContent = '🎯 Seguindo...';
    btn.classList.add('active');
    document.getElementById('status-text').textContent = '🎯 A seguir bus em tempo real';
  }
});

// Solo button: show only this vehicle
document.getElementById('panel-solo-btn').addEventListener('click', () => {
  const btn = document.getElementById('panel-solo-btn');
  const vehId = btn.dataset.vehicleId;
  if (!vehId) return;
  
  showOnlySelected = !showOnlySelected;
  if (showOnlySelected) {
    selectedVehicleId = vehId;
    btn.textContent = '🔍 Mostrando só este';
    btn.classList.add('active');
    updateMap();
  } else {
    btn.textContent = '🔍 Mostrar só este';
    btn.classList.remove('active');
    updateMap();
  }
});

// Watch list toggle
document.getElementById('watchlist-toggle-btn').addEventListener('click', toggleWatchList);
document.getElementById('watchlist-close').addEventListener('click', closeWatchList);
document.getElementById('watchlist-backdrop').addEventListener('click', closeWatchList);

// Watchlist editor
document.getElementById('watchlist-edit-btn').addEventListener('click', toggleEditor);
document.getElementById('editor-search-input').addEventListener('input', (e) => {
  renderEditor(e.target.value);
});

// Panel
document.querySelector('#info-panel .handle').addEventListener('click', closePanel);
document.getElementById('panel-close').addEventListener('click', closePanel);

// GPS button
document.getElementById('gps-btn').addEventListener('click', startGPS);

// Theme toggle
document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

// ─── START ───
initMap();
loadTheme();

// Pre-cargar líneas por defecto si no hay watchlist guardada
try {
  const existing = localStorage.getItem(STORAGE_KEY);
  if (!existing || JSON.parse(existing).length === 0) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_WATCH_LINES));
  }
} catch(e) {}
renderWatchList();

// Show learned stops for any existing watch list
setTimeout(() => showLearnedStops(), 1000);

fetchVehicles();
setInterval(fetchVehicles, REFRESH_MS);

setInterval(() => {
  if (vehiclesData.length > 0) updateStatus();
}, 1000);

console.log('🚌 Lisboa Bus Tracker iniciado!');
console.log(`🔄 Atualização a cada ${REFRESH_MS/1000}s`);
console.log('⭐ Lista de seguimento pronta!');
</script>
