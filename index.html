<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚌 Lisboa Bus Tracker - Tiempo Real</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #7c5cfc;
    --teal: #00f5e0;
    --gold: #ffe066;
    --red: #f85149;
    --green: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    z-index: 1000;
  }
  #header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  #header .badge {
    font-size: 11px;
    background: var(--surface2);
    color: var(--text2);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  #search-row {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 180px;
  }
  #search-row input {
    flex: 1;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    min-width: 60px;
  }
  #search-row input:focus {
    border-color: var(--accent);
  }
  #search-row input::placeholder {
    color: var(--text2);
  }
  .btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-star {
    background: transparent;
    border-color: var(--border);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
  }
  .btn-star.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }
  .btn-gps {
    background: var(--teal);
    color: #000;
    border-color: var(--teal);
    font-weight: 700;
  }
  .btn-gps:hover { background: #00d4c0; }
  .btn-metro {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
    font-weight: 700;
  }
  .btn-metro:hover { background: #d63a33; }
  #filter-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
  }
  #filter-row label {
    font-size: 12px;
    color: var(--text2);
  }
  .agency-btn {
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .agency-btn:hover { border-color: var(--accent); color: var(--text); }
  .agency-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .watch-mode-btn {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .watch-mode-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }
  #map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }
  #status-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
    z-index: 1000;
  }
  #status-bar span { display: flex; align-items: center; gap: 4px; }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .leaflet-container { background: #1a1a2e !important; }
  .leaflet-control-zoom a {
    background: var(--surface2) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-popup-content-wrapper {
    background: var(--surface) !important;
    color: var(--text) !important;
    border: 1px solid var(--border);
    border-radius: 10px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
  }
  .leaflet-popup-tip { background: var(--surface) !important; }
  .leaflet-popup-close-button { color: var(--text2) !important; }
  .bus-marker {
    background: var(--accent);
    border: 2px solid #fff;
    border-radius: 50%;
    width: 32px !important;
    height: 32px !important;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 2px 8px rgba(124,92,252,0.5);
    transition: all 0.3s ease;
  }
  .bus-marker.stopped { background: var(--red); }
  .bus-marker.moving { background: var(--accent); }
  .bus-marker.fast { background: var(--teal); color: #000; }
  .bus-marker.highlight {
    border-color: var(--gold);
    box-shadow: 0 0 16px rgba(255,224,102,0.6);
    transform: scale(1.2);
  }
  .bus-marker.watched {
    border-color: var(--gold) !important;
    border-width: 3px;
    box-shadow: 0 0 12px rgba(255,224,102,0.4);
  }
  .bus-marker.nearby {
    border-color: var(--teal) !important;
    border-width: 3px;
    box-shadow: 0 0 12px rgba(0,245,224,0.6);
  }
  .leaflet-marker-icon { border: none !important; }
  #info-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 55vh;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    border-radius: 16px 16px 0 0;
    padding: 16px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 2000;
    overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
  }
  #info-panel.open { transform: translateY(0); }
  #info-panel .handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 12px;
    cursor: pointer;
  }
  #info-panel h2 {
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--gold);
  }
  #info-panel .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  #info-panel .detail-row .label { color: var(--text2); }
  #info-panel .detail-row .value { font-weight: 600; }
  #info-panel .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
  }
  .watch-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    width: 100%;
    text-align: center;
  }
  .watch-btn.active {
    background: var(--gold);
    color: #000;
  }
  /* Metro suggestion box */
  .metro-suggestion {
    margin-top: 12px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 10px;
  }
  .metro-suggestion h3 {
    font-size: 14px;
    color: var(--teal);
    margin-bottom: 6px;
  }
  .metro-suggestion .metro-line {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 4px;
  }
  .metro-azul { background: #1E90FF; color: #fff; }
  .metro-amarela { background: #FFD700; color: #000; }
  .metro-verde { background: #2E8B57; color: #fff; }
  .metro-vermelha { background: #DC143C; color: #fff; }
  /* Watch list panel */
  #watchlist-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    max-width: 85vw;
    height: 100dvh;
    background: var(--surface);
    border-left: 2px solid var(--gold);
    z-index: 3000;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -4px 0 20px rgba(0,0,0,0.5);
  }
  #watchlist-panel.open { transform: translateX(0); }
  #watchlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #watchlist-header h2 {
    font-size: 16px;
    color: var(--gold);
  }
  #watchlist-header .close-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 22px;
    cursor: pointer;
  }
  #watchlist-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .watchlist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .watchlist-item:hover { background: var(--surface2); }
  .watchlist-item .line-name {
    font-weight: 600;
    font-size: 15px;
  }
  .watchlist-item .line-agency {
    font-size: 11px;
    color: var(--text2);
  }
  .watchlist-item .remove-btn {
    background: none;
    border: none;
    color: var(--red);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .watchlist-item .remove-btn:hover { opacity: 1; }
  #watchlist-empty {
    padding: 30px 16px;
    text-align: center;
    color: var(--text2);
    font-size: 14px;
  }
  #watchlist-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
  }
  .stop-icon {
    width: 10px !important;
    height: 10px !important;
    border-radius: 50%;
    background: var(--teal);
    opacity: 0.5;
    border: 1px solid var(--teal);
  }
  .user-location-icon {
    width: 20px !important;
    height: 20px !important;
    border-radius: 50%;
    background: #4285F4;
    border: 3px solid #fff;
    box-shadow: 0 0 10px rgba(66,133,244,0.6);
  }
  .user-accuracy {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(66,133,244,0.15);
    border: 2px solid rgba(66,133,244,0.4);
  }
  .leaflet-control-attribution { display: none !important; }
  .overlay-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 2500;
    display: none;
  }
  .overlay-backdrop.show { display: block; }
  @media (max-width: 600px) {
    #header { padding: 8px 10px; }
    #header h1 { font-size: 15px; }
    .btn { font-size: 12px; padding: 5px 10px; }
    #filter-row { padding: 6px 10px; }
    .agency-btn { font-size: 10px; padding: 2px 8px; }
    #watchlist-panel { width: 100%; max-width: 100vw; }
  }
</style>
</head>
<body>

<div id="header">
  <h1>🚌 Lisboa Bus Tracker</h1>
  <span class="badge" id="vehicle-count">—</span>
  <div id="search-row">
    <input type="text" id="line-search" placeholder="Línea (ej: 732, 201, 28E)" />
    <button class="btn" id="search-btn">🔍</button>
    <button class="btn" id="clear-btn">✕</button>
  </div>
  <button class="btn btn-gps" id="gps-btn" title="Mi ubicación">📍</button>
  <button class="btn btn-metro" id="metro-btn" title="Llévame al metro">🚇</button>
  <button class="btn btn-star" id="theme-toggle-btn" title="Alternar tema">☀️</button>
  <button class="btn btn-star" id="watchlist-toggle-btn" title="Lista de seguimento">⭐</button>
</div>

<div id="filter-row">
  <label>Operadora:</label>
  <button class="agency-btn active" data-agency="all">Todas</button>
  <button class="agency-btn" data-agency="1">Carris (Lisboa)</button>
  <button class="agency-btn" data-agency="41">CMetropolitana</button>
  <button class="agency-btn" data-agency="42">42</button>
  <button class="agency-btn" data-agency="43">43</button>
  <button class="agency-btn" data-agency="44">44</button>
  <button class="agency-btn" data-agency="15">15</button>
  <button class="agency-btn" data-agency="21">21</button>
  <span style="flex:1"></span>
  <button class="watch-mode-btn" id="watch-mode-btn">⭐ Solo seguidas</button>
</div>

<div id="map"></div>

<div id="status-bar">
  <span><span class="live-dot"></span> Tiempo real</span>
  <span id="status-text">A carregar...</span>
  <span>🔍 clique num bus para detalles</span>
</div>

<div id="info-panel">
  <div class="handle"></div>
  <button class="close-btn" id="panel-close">✕</button>
  <h2 id="panel-title">🚌 Bus</h2>
  <div id="panel-details"></div>
  <div id="metro-suggestion-container"></div>
  <button class="watch-btn" id="panel-watch-btn">⭐ Seguir linha</button>
</div>

<div class="overlay-backdrop" id="watchlist-backdrop"></div>
<div id="watchlist-panel">
  <div id="watchlist-header">
    <h2>⭐ Lista de seguimento</h2>
    <button class="close-btn" id="watchlist-close">✕</button>
  </div>
  <div id="watchlist-body">
    <div id="watchlist-empty">Nenhuma linha seguida ainda.<br>Clique num bus e use ⭐ Seguir linha</div>
  </div>
  <div id="watchlist-footer">
    <span id="watchlist-count">0 linhas</span>
    <button class="watch-mode-btn" id="watchlist-mode-btn">🔍 Mostrar no mapa</button>
  </div>
</div>

<script>
// ─── CONFIG ───
const REFRESH_MS = 3000;
const CARRS_CENTER = [38.7223, -9.1393];

const STORAGE_KEY = 'lisboa_bus_watchlist';
const ANIM_DURATION = 2500;

// ─── LISBOA METRO STATIONS ───
// Coordenadas de las principales estaciones de metro de Lisboa con sus líneas
const METRO_STATIONS = [

// ─── STATE ───
let map, vehiclesLayer, stopsLayer, routeLayer, tileLayerInstance;
let userMarker = null, userAccuracy = null;
let userLocation = null;
let gpsWatchId = null;
let vehiclesData = [];
let allMarkers = {};
let activeAgency = 'all';
let searchLine = '';
let selectedVehicleId = null;
let activeRouteLine = null;

let watchMode = false;
let animationFrameId = null;
let lastAnimTime = 0;

// ─── HAVERSINE DISTANCE ───
function haversineDistance(lat1, lon1, lat2, lon2) {

// ─── WATCH LIST ───
function getWatchList() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveWatchList(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function addWatchLine(lineName, agencyId) {
  const list = getWatchList();
  if (list.some(item => item.line === lineName && item.agency === agencyId)) return false;
  list.push({ line: lineName, agency: agencyId, addedAt: Date.now() });
  saveWatchList(list); renderWatchList(); updateMap(); return true;
}
function removeWatchLine(lineName, agencyId) {
  let list = getWatchList().filter(item => !(item.line === lineName && item.agency === agencyId));
  saveWatchList(list); renderWatchList(); updateMap();
}
function isLineWatched(lineName, agencyId) {
  return getWatchList().some(item => item.line === lineName && item.agency === agencyId);
}
function renderWatchList() {
  const list = getWatchList();
  const body = document.getElementById('watchlist-body');
  document.getElementById('watchlist-count').textContent = `${list.length} linha${list.length !== 1 ? 's' : ''}`;
  if (list.length === 0) {
    body.innerHTML = '<div id="watchlist-empty">Nenhuma linha seguida ainda.<br>Clique num bus e use ⭐ Seguir linha</div>';
    return;
  }
  body.innerHTML = list.map((item, idx) => {
    const color = AGENCY_COLORS[item.agency] || '#7c5cfc';
    const agencyName = AGENCY_NAMES[item.agency] || `Op. ${item.agency}`;
    return `<div class="watchlist-item" data-idx="${idx}">
      <div><div class="line-name" style="color:${color}">🚌 ${item.line}</div>
      <div class="line-agency">${agencyName}</div></div>
      <button class="remove-btn" data-line="${item.line}" data-agency="${item.agency}">✕</button></div>`;
  }).join('');
  body.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); removeWatchLine(btn.dataset.line, btn.dataset.agency); });
  });
  body.querySelectorAll('.watchlist-item').forEach(el => {
    el.addEventListener('click', () => {
      const line = el.querySelector('.remove-btn')?.dataset.line;
      if (line) { watchMode = true; document.getElementById('watch-mode-btn').classList.add('active'); searchLine = line; document.getElementById('line-search').value = line; updateMap(); closeWatchList(); }
    });
  });
}
function toggleWatchList() {
  const panel = document.getElementById('watchlist-panel');
  const backdrop = document.getElementById('watchlist-backdrop');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open'); backdrop.classList.toggle('show');
  if (!isOpen) renderWatchList();
}
function closeWatchList() {
  document.getElementById('watchlist-panel').classList.remove('open');
  document.getElementById('watchlist-backdrop').classList.remove('show');
}

// ─── GPS / UBICACIÓN ───
function toggleGPS() {
    if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (userAccuracy) { map.removeLayer(userAccuracy); userAccuracy = null; }
    userLocation = null;
    document.getElementById('gps-btn').classList.remove('active');
    document.getElementById('status-text').textContent = 'GPS desactivado';
    return;
  }
  if (!navigator.geolocation) { alert('Geolocalización no soportada por tu navegador.'); return; }
  document.getElementById('status-text').textContent = '📡 Buscando tu ubicación...';
  gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      userLocation = { lat, lon };
      if (!userMarker) {
        userAccuracy = L.circle([lat, lon], { radius: acc, className: 'user-accuracy' }).addTo(map);
        userMarker = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="user-location-icon"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(map);
        map.setView([lat, lon], 16);
      } else {
        userMarker.setLatLng([lat, lon]);
        userAccuracy.setLatLng([lat, lon]);
        userAccuracy.setRadius(acc);
        map.panTo([lat, lon], { animate: true, duration: 0.3 });
      }
      document.getElementById('status-text').textContent = `📍 GPS activo (±${Math.round(acc)}m)`;
      document.getElementById('gps-btn').classList.add('active');
    },
    (err) => {
      console.error('GPS error:', err);
      document.getElementById('status-text').textContent = '⚠️ Error GPS: ' + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

// ─── FUNCIÓN METRO: Encuentra el bus cercano que te deja antes en una estación de metro ───
function findBestBusToMetro() {
  if (!userLocation) { alert('Activa primero el GPS (botón 📍) para saber dónde estás.'); return; }
  const nearbyBuses = vehiclesData.filter(v => {
    if (!v.latitude || !v.longitude) return false;
    const dist = haversineDistance(userLocation.lat, userLocation.lon, v.latitude, v.longitude);
    return dist <= NEARBY_RADIUS_METERS;
  }).map(v => ({
    ...v,
    distance: haversineDistance(userLocation.lat, userLocation.lon, v.latitude, v.longitude),
    lineName: formatLineName(v)
  }));
  if (nearbyBuses.length === 0) {
    showMetroSuggestion(null, 'No hay buses a menos de 500m de tu ubicación actual.');
    return;
  }
  // Para cada bus cercano, calculamos si su ruta pasa cerca de alguna estación de metro
  let bestOption = null;
  let bestScore = Infinity; // Menor distancia a una estación de metro
  for (const bus of nearbyBuses) {
    const shape = ROUTE_SHAPES[bus.lineName];
    if (!shape || shape.length < 2) continue;
    // Buscar el punto más cercano de la ruta del bus a cualquier estación de metro
    for (const station of METRO_STATIONS) {
      for (const point of shape) {
        const dist = haversineDistance(point[0], point[1], station.lat, station.lon);
        if (dist < 150 && dist < bestScore) { // La ruta pasa a menos de 150m de la estación
          bestScore = dist;
          bestOption = { bus, station, routeDistToStation: dist };
        }
      }
    }
  }
  showMetroSuggestion(bestOption, nearbyBuses.length);
}

function showMetroSuggestion(option, nearbyCount) {
  const container = document.getElementById('metro-suggestion-container');
  const panel = document.getElementById('info-panel');
  if (!option) {
    container.innerHTML = `<div class="metro-suggestion">
      <h3>🚇 Ruta rápida al Metro</h3>
      <p style="font-size:13px;color:var(--text2);">Hay <b>${nearbyCount || 0}</b> buses cerca, pero ninguno tiene una ruta que pase cerca de una estación de metro conocida. Camina a la estación más próxima o toma otro transporte.</p>
    </div>`;
  } else {
    const lineColor = AGENCY_COLORS[option.bus.agency_id || getAgencyId(option.bus)] || '#7c5cfc';
    const linesHTML = option.station.lines.map(l => `<span class="metro-line metro-${l}">${l.toUpperCase()}</span>`).join(' ');
    container.innerHTML = `<div class="metro-suggestion">
      <h3>🚇 ¡Opción Rápida!</h3>
      <p style="font-size:13px;margin-bottom:8px;">Toma el bus <b style="color:${lineColor}">${option.bus.lineName}</b> (a ${Math.round(option.bus.distance)}m de ti).</p>
      <p style="font-size:13px;margin-bottom:8px;">Su ruta pasa cerca de la estación de metro <b>${option.station.name}</b> ${linesHTML}.</p>
      <p style="font-size:12px;color:var(--teal);">🚀 Evitarás el tráfico llegando antes al metro.</p>
    </div>`;
  }
  panel.classList.add('open');
}

// ─── FETCH ───
async function fetchVehicles() {
  try {
    const url = 'https://go.tmlmobilidade.pt/hub/api/v1/realtime/vehicles/positions';
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    vehiclesData = await resp.json().then(j => j.data || []);
    updateMap(); updateStatus();
    if (isFirstLoad && !gpsWatchId) { fitBounds(); isFirstLoad = false; }
  } catch (e) {
    document.getElementById('status-text').textContent = '⚠️ Erro a carregar dados';
  }
}
function fitBounds() {
  if (vehiclesData.length === 0) return;
  const bounds = vehiclesData.filter(v => v.latitude && v.longitude).map(v => [v.latitude, v.longitude]);
  if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}
function updateMap() {
  const filtered = filterVehicles();
  document.getElementById('vehicle-count').textContent = `${filtered.length} veículo${filtered.length !== 1 ? 's' : ''}`;
  const now = Date.now();
  const newMarkers = {};
  const prevData = vehiclesLayer._prevData || {};
  const seenIds = new Set();
  for (const v of filtered) {
    const lat = v.latitude, lon = v.longitude;
    if (!lat || !lon) continue;
    const lineName = formatLineName(v);
    const agency = getAgencyId(v);
    const isWatched = isLineWatched(lineName, agency);
    const vehicleId = v._id || v.vehicle_id;
    seenIds.add(vehicleId);
    let isNearby = false;
    if (userLocation) {
      const dist = haversineDistance(userLocation.lat, userLocation.lon, lat, lon);
      if (dist <= NEARBY_RADIUS_METERS) isNearby = true;
    }
    let marker = prevData[vehicleId]?.marker;
    if (marker) {
      marker._fromLat = marker._targetLat !== undefined ? marker._targetLat : marker.getLatLng().lat;
      marker._fromLon = marker._targetLon !== undefined ? marker._targetLon : marker.getLatLng().lng;
      marker._targetLat = lat; marker._targetLon = lon; marker._animStart = now; marker._vehicleData = v;
      let className = 'bus-marker ' + getStatusClass(v.speed);
      if (isWatched) className += ' watched';
      if (isNearby) className += ' nearby';
      if (selectedVehicleId === vehicleId) className += ' highlight';
      if (marker._wasWatched !== isWatched || marker._wasNearby !== isNearby) {
        marker.setIcon(L.divIcon({ className, html: `<span>${lineName}</span>`, iconSize: selectedVehicleId === vehicleId ? [40, 40] : [32, 32], iconAnchor: selectedVehicleId === vehicleId ? [20, 20] : [16, 16] }));
        marker._wasWatched = isWatched; marker._wasNearby = isNearby;
      }
    } else {
      let className = 'bus-marker ' + getStatusClass(v.speed);
      if (isWatched) className += ' watched';
      if (isNearby) className += ' nearby';
      const icon = L.divIcon({ className, html: `<span>${lineName}</span>`, iconSize: [32, 32], iconAnchor: [16, 16] });
      marker = L.marker([lat, lon], { icon });
      marker._vehicleId = vehicleId; marker._vehicleData = v;
      marker._targetLat = lat; marker._targetLon = lon; marker._fromLat = lat; marker._fromLon = lon;
      marker._animStart = now; marker._wasWatched = isWatched; marker._wasNearby = isNearby;
      marker.on('click', (e) => { L.DomEvent.stopPropagation(e); selectVehicle(v, marker); });
      vehiclesLayer.addLayer(marker);
    }
    if (selectedVehicleId === vehicleId) {
      marker.setIcon(L.divIcon({ className: 'bus-marker ' + getStatusClass(v.speed) + ' highlight' + (isWatched ? ' watched' : '') + (isNearby ? ' nearby' : ''), html: `<span>${lineName}</span>`, iconSize: [40, 40], iconAnchor: [20, 20] }));
    }
    newMarkers[vehicleId] = { marker, v };
  }
  for (const id in prevData) { if (!seenIds.has(id)) vehiclesLayer.removeLayer(prevData[id].marker); }
  vehiclesLayer._prevData = newMarkers;
  allMarkers = {};
  for (const id in newMarkers) allMarkers[id] = newMarkers[id].marker;
  if (!animationFrameId) animateMarkers();
  if (selectedVehicleId) {
    const stillHere = filtered.find(v => (v._id || v.vehicle_id) === selectedVehicleId);
    if (stillHere) showVehiclePanel(stillHere); else closePanel();
  }
  updateRouteDisplay();
}
function animateMarkers() {
  animationFrameId = requestAnimationFrame(animateMarkers);
  const now = Date.now();
  const prevData = vehiclesLayer._prevData || {};
  let anyAnimating = false;
  for (const id in prevData) {
    const { marker } = prevData[id];
    if (marker._targetLat === undefined || marker._fromLat === undefined) continue;
    const elapsed = now - (marker._animStart || now);
    const t = Math.min(elapsed / ANIM_DURATION, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    marker.setLatLng([marker._fromLat + (marker._targetLat - marker._fromLat) * ease, marker._fromLon + (marker._targetLon - marker._fromLon) * ease]);
    if (t < 1) anyAnimating = true;
  }
  if (!anyAnimating) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
}
function filterVehicles() {
  let filtered = vehiclesData;
  const watchList = getWatchList();
  if (watchMode && watchList.length > 0) {
    return filtered.filter(v => isLineWatched(formatLineName(v), getAgencyId(v)));
  }
  if (activeAgency !== 'all') filtered = filtered.filter(v => getAgencyId(v) === activeAgency);
  if (searchLine) {
    const terms = searchLine.toLowerCase().split(/[\s,]+/).filter(t => t);
    const expandedTerms = [];
    terms.forEach(t => expandLineSearch(t).forEach(et => expandedTerms.push(et.toLowerCase())));
    filtered = filtered.filter(v => {
      const lineName = formatLineName(v).toLowerCase();
      if (terms.some(t => lineName === t.toLowerCase())) return true;
      const rawLine = (v.line_id || '').toLowerCase();
      return expandedTerms.some(t => rawLine.replace(/^\[\d+\]/, '') === t);
    });
  }
  return filtered;
}
function updateStatus() {
  const time = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('status-text').textContent = `${vehiclesData.length} veículos · ${time}`;
}
function selectVehicle(v, marker) {
  selectedVehicleId = v._id || v.vehicle_id;
  activeRouteLine = formatLineName(v);
  showVehiclePanel(v);
  map.panTo([v.latitude, v.longitude], { animate: true, duration: 0.3 });
  updateRouteDisplay();
}
function showVehiclePanel(v) {
  const panel = document.getElementById('info-panel');
  panel.classList.add('open');
  const lineName = formatLineName(v);
  const agency = getAgencyId(v);
  const color = AGENCY_COLORS[agency] || '#7c5cfc';
  const isWatched = isLineWatched(lineName, agency);
  document.getElementById('panel-title').innerHTML = `<span style="color:${color}">🚌 ${lineName}</span> · ${AGENCY_NAMES[agency] || `Op. ${agency}`}`;
  let distText = '—';
  if (userLocation) distText = `${Math.round(haversineDistance(userLocation.lat, userLocation.lon, v.latitude, v.longitude))}m de ti`;
  document.getElementById('panel-details').innerHTML = `
    <div class="detail-row"><span class="label">Distancia</span><span class="value">${distText}</span></div>
    <div class="detail-row"><span class="label">Velocidade</span><span class="value">${v.speed !== undefined ? v.speed + ' km/h' : '—'}</span></div>
    <div class="detail-row"><span class="label">Estado</span><span class="value">${getStatusText(v.speed)}</span></div>
    <div class="detail-row"><span class="label">Rumo</span><span class="value">${v.bearing !== undefined ? v.bearing + '°' : '—'}</span></div>
    <div class="detail-row"><span class="label">Lat/Lon</span><span class="value">${v.latitude?.toFixed(5)}, ${v.longitude?.toFixed(5)}</span></div>
  `;
  document.getElementById('metro-suggestion-container').innerHTML = '';
  const watchBtn = document.getElementById('panel-watch-btn');
  watchBtn.textContent = isWatched ? '⭐ Seguindo' : '⭐ Seguir linha';
  watchBtn.classList.toggle('active', isWatched);
  watchBtn.dataset.line = lineName; watchBtn.dataset.agency = agency;
}
function closePanel() {
  selectedVehicleId = null; activeRouteLine = null;
  document.getElementById('info-panel').classList.remove('open');
  updateRouteDisplay();
}
// Event Listeners
document.querySelectorAll('.agency-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.agency-btn.active')?.classList.remove('active');
    btn.classList.add('active'); activeAgency = btn.dataset.agency;
    watchMode = false; document.getElementById('watch-mode-btn').classList.remove('active');
    updateMap(); if (vehiclesData.length > 0) updateStatus();
  });
});
document.getElementById('search-btn').addEventListener('click', () => {
  searchLine = document.getElementById('line-search').value.trim();
  if (searchLine) { watchMode = false; document.getElementById('watch-mode-btn').classList.remove('active'); }
  updateMap();
});
document.getElementById('line-search').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') { searchLine = e.target.value.trim(); if (searchLine) { watchMode = false; document.getElementById('watch-mode-btn').classList.remove('active'); } updateMap(); }
});
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('line-search').value = ''; searchLine = ''; activeAgency = 'all'; watchMode = false;
  document.querySelector('.agency-btn.active')?.classList.remove('active');
  document.querySelector('[data-agency="all"]')?.classList.add('active');
  document.getElementById('watch-mode-btn').classList.remove('active'); updateMap();
});
document.getElementById('watch-mode-btn').addEventListener('click', () => {
  const list = getWatchList(); if (list.length === 0) { toggleWatchList(); return; }
  watchMode = !watchMode; document.getElementById('watch-mode-btn').classList.toggle('active', watchMode); updateMap();
});
document.getElementById('watchlist-mode-btn').addEventListener('click', () => {
  watchMode = true; document.getElementById('watch-mode-btn').classList.add('active'); closeWatchList(); updateMap();
});
document.getElementById('panel-watch-btn').addEventListener('click', () => {
  const btn = document.getElementById('panel-watch-btn');
  const lineName = btn.dataset.line, agencyId = btn.dataset.agency;
  if (!lineName) return;
  if (isLineWatched(lineName, agencyId)) { removeWatchLine(lineName, agencyId); btn.textContent = '⭐ Seguir linha'; btn.classList.remove('active'); }
  else { addWatchLine(lineName, agencyId); btn.textContent = '⭐ Seguindo'; btn.classList.add('active'); }
});
document.getElementById('gps-btn').addEventListener('click', toggleGPS);
document.getElementById('metro-btn').addEventListener('click', findBestBusToMetro);
document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
document.getElementById('watchlist-toggle-btn').addEventListener('click', toggleWatchList);
document.getElementById('watchlist-close').addEventListener('click', closeWatchList);
document.getElementById('watchlist-backdrop').addEventListener('click', closeWatchList);
document.querySelector('#info-panel .handle').addEventListener('click', closePanel);
document.getElementById('panel-close').addEventListener('click', closePanel);

function showRouteLine(lineName) {
  if (!routeLayer || !stopsLayer) return;
  routeLayer.clearLayers(); stopsLayer.clearLayers();
  const coords = ROUTE_SHAPES[lineName];
  if (coords && coords.length >= 2) {
    const colors = {'728': '#7c5cfc', '731': '#ff6b6b', '2713': '#00f5e0'};
    const color = colors[lineName] || '#7c5cfc';
    const polyline = L.polyline(coords, { color, weight: 5, opacity: 0.8, dashArray: '10 8' });
    polyline.bindTooltip(`🚌 ${lineName}`, { direction: 'top', offset: [0, -5] });
    routeLayer.addLayer(polyline);
  }
  const stops = ROUTE_STOPS[lineName];
  if (stops) stops.forEach(s => {
    const stopIcon = L.divIcon({ className: '', html: '<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7c5cfc;box-shadow:0 0 6px rgba(124,92,252,0.5);"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    const marker = L.marker([s.lat, s.lon], { icon: stopIcon });
    marker.bindTooltip(`🚏 ${s.name}`, { direction: 'top', offset: [0, -5] });
    stopsLayer.addLayer(marker);
  });
}
function updateRouteDisplay() {
  if (!routeLayer || !stopsLayer) return;
  if (searchLine) { showRouteLine(searchLine); return; }
  if (activeRouteLine) { showRouteLine(activeRouteLine); return; }
  if (watchMode) { const list = getWatchList(); if (list.length > 0) showRouteLine(list[0].line); return; }
  routeLayer.clearLayers(); stopsLayer.clearLayers();
}
function setLightTheme() {
  document.documentElement.setAttribute('data-theme', 'light');
  localStorage.setItem('lisboa_bus_theme', 'light');
  if (tileLayerInstance && map) {
    map.removeLayer(tileLayerInstance);
    tileLayerInstance = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
  }
  document.getElementById('theme-toggle-btn').textContent = '☀️';
}
function loadTheme() {
  const saved = localStorage.getItem('lisboa_bus_theme');
  if (saved === 'light') setLightTheme();
  else document.getElementById('theme-toggle-btn').textContent = '🌓';
}
function toggleTheme() {
  if (document.documentElement.getAttribute('data-theme') === 'light') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('lisboa_bus_theme', 'dark');
    if (tileLayerInstance && map) { map.removeLayer(tileLayerInstance); tileLayerInstance = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map); }
    document.getElementById('theme-toggle-btn').textContent = '🌓';
  } else setLightTheme();
}

initMap();
loadTheme();
renderWatchList();
fetchVehicles();
setInterval(fetchVehicles, REFRESH_MS);
setInterval(() => { if (vehiclesData.length > 0) updateStatus(); }, 1000);
console.log('🚌 Lisboa Bus Tracker iniciado!');
</script>
